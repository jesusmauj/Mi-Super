<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <title>Mi Súper</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Mi Súper</h1>
      <button class="loc" id="btn-loc" hidden></button>
    </div>
    <button class="icon-btn" id="btn-menu" aria-label="Menú">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <button class="fab" id="btn-add">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fab-label">Agregar producto</span>
  </button>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="intro-screen" id="intro" hidden></div>

  <script src="catalog.js"></script>
  <script src="regions.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
