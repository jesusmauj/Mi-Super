<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ecfdf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1411" media="(prefers-color-scheme: dark)">
  <title>Mi Súper</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="26" height="26" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18h14l14 48h48" fill="none" stroke-width="8"/><path d="M26 34h66l-9 26H34z" stroke="none"/><circle cx="42" cy="80" r="7" stroke="none"/><circle cx="76" cy="80" r="7" stroke="none"/></svg>
      </span>
      <div class="brand-text">
        <h1>Mi Súper</h1>
        <button class="loc" id="btn-loc" hidden></button>
      </div>
    </div>
    <button class="icon-btn" id="btn-menu" aria-label="Menú" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <button class="fab" id="btn-add">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fab-label">Agregar producto</span>
  </button>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="intro-screen" id="intro" hidden></div>

  <script src="catalog.js"></script>
  <script src="regions.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
